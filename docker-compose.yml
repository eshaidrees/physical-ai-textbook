version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_CLUSTER_ID=${QDRANT_CLUSTER_ID}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - NEON_DB_URL=${NEON_DB_URL}
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_CLUSTER_ID}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_book
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend_book:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data: